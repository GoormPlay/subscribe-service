spring:
  application:
    name: subscribe-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
server:
  port: ${SPRING_SERVER_PORT:8085}

#?db 9000, 3306

# ✅ Actuator 설정 자동 삽입
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
  health:
    defaults:
      enabled: true
    mongo:
      enabled: false
    kafka:
      enabled: false
    redis:
      enabled: false
    rabbit:
      enabled: false
