spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${DB_NAME:subscribe_db}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 5     # 로컬에선 5로 줄이기
      minimum-idle: 1
      idle-timeout: 30000      # 30초
      max-lifetime: 1800000    # 30분
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
# ✅ Actuator 설정 자동 삽입
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never
  health:
    defaults:
      enabled: true
    mongo:
      enabled: false
    kafka:
      enabled: false
    redis:
      enabled: false
    rabbit:
      enabled: false
