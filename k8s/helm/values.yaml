image:
  repository: roin09/subscribe-service
  tag: latest

service:
  port: 80
  targetPort: 8085

env:
  useConfigMap: true
  useSecret: true

replicaCount: 1

ingress:
  enabled: false

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-type
              operator: In
              values:
                - medium

resources:
  requests:
    cpu: 300m
    memory: 384Mi
  limits:
    cpu: 500m
    memory: 512Mi
